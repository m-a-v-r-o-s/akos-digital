<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#041215">
<title>G.E.S Private Tours · Private shore excursions in every Greek port</title>
<meta name="description" content="Private, tailor-made tours in every major Greek cruise port, planned around your ship's hours. By G.E.S Travel Agency, Rhodes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
/* Port Clock: their black-teal and gold for chrome, limestone light for planning. Logo's serif italic sets the voice; Space Grotesk carries times and ship hours. */
:root{
  --ink:#041215; --ink2:#0a1f23; --ink3:#12302f; --line-d:rgba(255,255,255,.1);
  --gold:#d7ae4e; --gold2:#ecd18a; --goldd:#86651a; --goldgrad:linear-gradient(135deg,#f0d58c 0%,#d7ae4e 50%,#a9821f 100%);
  --paper:#f2f4f3; --card:#ffffff; --text:#0c1d20; --muted:#4f6265; --line:#d9e0df;
  --sea:#0b7a83; --sea-soft:#dcefee; --warn:#a86a00; --warn-soft:#fbefd8; --no:#8a9799;
  --on-d:#eef3f2; --muted-d:#a5b7b8;
  --f-d:"Instrument Serif",Georgia,serif; --f-b:"DM Sans",system-ui,sans-serif; --f-u:"Space Grotesk",system-ui,sans-serif;
  --spring:linear(0,.178 4.2%,.531 10.6%,.787 17.3%,.931 24.5%,.986 31.7%,1.003 40%,1.004 52%,1);
  --r:16px; --hdr:76px;
  --gx:max(20px,env(safe-area-inset-left,0px)); --gxr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.65 var(--f-b);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gxr)}
.ey{font:500 12px/1.2 var(--f-u);letter-spacing:.22em;text-transform:uppercase;color:var(--goldd)}
.dark .ey,.ey.on-d{color:var(--gold)}
.disp{font-family:var(--f-d);font-weight:400;letter-spacing:-.01em}
.u{font-family:var(--f-u)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dark{background:var(--ink);color:var(--on-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:600 15px var(--f-b);text-decoration:none;transition:transform .5s var(--spring),background .3s,border-color .3s,color .3s;touch-action:manipulation;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn-gold{background:var(--goldgrad);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--gold2)}
.btn-line{border-color:var(--line);background:var(--card);color:var(--text)}
.btn-line:hover{border-color:var(--goldd)}
.dark .btn-line{background:transparent;border-color:rgba(215,174,78,.5);color:var(--gold2)}
section{padding-block:clamp(64px,8vw,112px)}
.sec-h{display:grid;gap:12px;margin-bottom:clamp(26px,4vw,44px);max-width:740px}
.sec-h h2{font:400 clamp(36px,5vw,62px)/1.02 var(--f-d);letter-spacing:-.01em}
.sec-h p{color:var(--muted);font-size:17px}
.dark .sec-h p{color:var(--muted-d)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
header.site{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;color:var(--on-d);transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
header.site.solid,header.site.always{background:rgba(4,18,21,.9);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-color:var(--line-d)}
.hdr{height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand img{width:150px;height:auto}
nav.main{display:flex;gap:28px;font:500 14px var(--f-b)}
nav.main a{text-decoration:none;opacity:.85;padding:8px 0;position:relative}
nav.main a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--spring)}
nav.main a:hover,nav.main a[aria-current="page"]{opacity:1}
nav.main a:hover::after,nav.main a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-r{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line-d);border-radius:999px;padding:3px}
.lang button{background:none;border:0;min-width:40px;min-height:32px;border-radius:999px;font:600 12px var(--f-u);letter-spacing:.1em;color:var(--muted-d)}
.lang button[aria-pressed="true"]{background:rgba(215,174,78,.18);color:var(--gold2)}
.hdr .btn{min-height:42px;padding:0 20px;font-size:14px}
.burger{display:none;background:none;border:1px solid var(--line-d);width:44px;height:44px;border-radius:50%;place-items:center}
.burger span{display:block;width:16px;height:1px;background:var(--on-d);box-shadow:0 5px 0 var(--on-d),0 -5px 0 var(--on-d)}
@media (max-width:1000px){nav.main,.hdr .btn{display:none}.burger{display:grid}.brand img{width:126px}}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(2,10,12,.55);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer.open{opacity:1;pointer-events:auto}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(86vw,360px);background:var(--ink);color:var(--on-d);padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 26px;display:flex;flex-direction:column;gap:4px;transform:translateX(100%);transition:transform .6s var(--spring)}
.drawer.open .panel{transform:none}
.drawer a{font:400 26px/1.2 var(--f-d);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line-d)}
.drawer .close{align-self:flex-end;background:none;border:1px solid var(--line-d);border-radius:50%;width:44px;height:44px;font-size:20px;margin-bottom:12px;color:var(--on-d)}

.js [data-rise]{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform 1s var(--spring)}
.js [data-rise].in{opacity:1;transform:none}

/* hero */
.hero{position:relative;padding:calc(var(--hdr) + clamp(70px,12vw,150px)) 0 0;color:var(--on-d);isolation:isolate;overflow:hidden;background:var(--ink)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;z-index:-2;animation:kb 20s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,18,21,.72) 0%,rgba(4,18,21,.5) 28%,rgba(4,18,21,.62) 48%,rgba(4,18,21,.9) 72%,var(--ink) 100%)}
.hero h1,.hero .lede{text-shadow:0 2px 24px rgba(4,18,21,.55)}
.hero-copy{display:grid;gap:20px;max-width:760px;padding-bottom:clamp(40px,6vw,64px)}
.hero h1{font:400 clamp(50px,8vw,108px)/.98 var(--f-d);letter-spacing:-.02em}
.hero h1 span{color:var(--gold);font-style:italic}
.hero .lede{font-size:clamp(17px,1.7vw,20px);color:#d8e3e2;max-width:52ch}
.stars{color:var(--gold);letter-spacing:.3em;font-size:14px}

/* planner */
.planner{background:var(--card);color:var(--text);border-radius:22px;box-shadow:0 40px 90px -40px rgba(4,18,21,.6);padding:clamp(18px,2.6vw,30px);display:grid;gap:18px;position:relative;z-index:2}
.pl-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.pl-top h2{font:400 clamp(22px,2.4vw,30px)/1.1 var(--f-d)}
.pl-top p{color:var(--muted);font-size:14px}
.pl-f{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
@media (max-width:900px){.pl-f{grid-template-columns:1fr 1fr}.pl-f .fld:first-child{grid-column:1/-1}.pl-f .btn{grid-column:1/-1}}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.lbl{font:500 11px var(--f-u);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;transition:border-color .3s,background .3s;appearance:none;-webkit-appearance:none;color:var(--text)}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--goldd) 50%),linear-gradient(135deg,var(--goldd) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld input[type="time"]{font-family:var(--f-u);font-weight:500}
.fld textarea{min-height:100px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--goldd);background:#fff}
.fld .hint{font-size:13px;color:var(--muted)}
.ashore{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--sea-soft);color:#064d53;font-size:15px}
.ashore b{font:600 22px var(--f-u);color:var(--sea)}
.ashore.bad{background:var(--warn-soft);color:#6b4300}
.ashore.bad b{color:var(--warn)}

/* fit list */
.fits{display:grid;gap:10px}
.fit{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-decoration:none;transition:border-color .3s,transform .5s var(--spring)}
.fit:hover{border-color:var(--goldd);transform:translateY(-2px)}
.fit img{width:120px;height:84px;object-fit:cover;border-radius:10px}
.fit h3{font:600 17px/1.3 var(--f-b)}
.fit .pr{text-align:right;display:grid;gap:2px}
.fit .pr b{font:600 20px var(--f-u)}
.fit .pr small{color:var(--muted);font-size:12px}
.fit.no{opacity:.55}
@media (max-width:640px){.fit{grid-template-columns:84px 1fr}.fit img{width:84px;height:84px}.fit .pr{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;text-align:left}}
.tl{position:relative;height:26px;margin-top:8px}
.tl .track{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:4px;background:var(--line)}
.tl .seg{position:absolute;top:8px;height:10px;border-radius:10px;background:var(--sea);transform-origin:left;transform:scaleX(0);transition:transform 1s var(--spring)}
.tl.drawn .seg{transform:scaleX(1)}
.fit.tight .seg{background:var(--warn)}
.fit.no .seg{background:var(--no)}
.tl .tick{position:absolute;top:0;font:500 10px var(--f-u);color:var(--muted);translate:-50% 0;white-space:nowrap}
.tl .tick::after{content:"";position:absolute;left:50%;top:13px;width:1px;height:12px;background:var(--muted)}
.tl .tick.end{color:var(--text)}
.status{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-u);letter-spacing:.04em;margin-top:2px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sea)}
.fit.tight .status::before{background:var(--warn)}
.fit.no .status::before{background:var(--no)}

/* ports */
.ports{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ports a:first-child{grid-column:span 2;grid-row:span 2}
@media (max-width:960px){.ports{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.ports{grid-template-columns:1fr}.ports a:first-child{grid-column:auto;grid-row:auto}}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;min-height:240px;display:flex;align-items:flex-end;text-decoration:none;color:#fff;isolation:isolate}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.pcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,18,21,.88) 6%,rgba(4,18,21,0) 60%)}
.pcard:hover img{transform:scale(1.06)}
.pcard .in{padding:20px;display:grid;gap:4px}
.pcard h3{font:400 30px/1.05 var(--f-d)}
.pcard small{font:500 12px var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.pcard .home{position:absolute;top:16px;left:16px;background:var(--goldgrad);color:var(--ink);font:600 11px var(--f-u);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px}

/* tours grid */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:960px){.tgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.tgrid{grid-template-columns:1fr}}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;transition:transform .6s var(--spring),box-shadow .4s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(4,18,21,.45)}
.tcard .ph{aspect-ratio:4/3;overflow:hidden;position:relative}
.tcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.tcard:hover .ph img{transform:scale(1.06)}
.tcard .port{position:absolute;left:12px;top:12px;background:rgba(4,18,21,.8);color:var(--gold2);font:500 11px var(--f-u);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.tcard .bd{padding:18px 20px 20px;display:grid;gap:8px;flex:1}
.tcard h3{font:400 22px/1.2 var(--f-d)}
.tcard p{color:var(--muted);font-size:15px}
.tcard .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.tcard .meta b{font:600 18px var(--f-u);color:var(--text)}

/* home-port feature */
.homeport{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
@media (max-width:900px){.homeport{grid-template-columns:1fr}}
.collage{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:220px 220px;gap:12px}
.collage img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.collage img:first-child{grid-row:span 2}
@media (max-width:560px){.collage{grid-template-rows:160px 160px}}
.people{display:flex;gap:12px;flex-wrap:wrap}
.person{flex:1;min-width:220px;border:1px solid var(--line-d);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.person small{font:500 11px var(--f-u);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.person b{font:500 19px var(--f-u)}

/* promise */
.promise{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line-d)}
@media (max-width:800px){.promise{grid-template-columns:1fr}}
.promise div{padding:26px 26px 26px 0;display:grid;gap:8px}
.promise div+div{padding-left:26px;border-left:1px solid var(--line-d)}
@media (max-width:800px){.promise div+div{padding-left:0;border-left:0;border-top:1px solid var(--line-d)}}
.promise b{font:400 24px var(--f-d);color:var(--gold2)}
.promise p{color:var(--muted-d);font-size:15px}

/* tailor */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:500 14px var(--f-b);transition:background .3s,border-color .3s,color .3s,transform .5s var(--spring)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--gold2)}
a.chip{text-decoration:none}
.chip.wa{background:#1f9f55;border-color:#1f9f55;color:#fff}
.chip.vb{background:#6f4fd1;border-color:#6f4fd1;color:#fff}
.chip svg{width:18px;height:18px;fill:currentColor}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3vw,32px)}
.panel.dark{background:var(--ink);color:var(--on-d);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

/* page hero */
.phero{position:relative;min-height:440px;display:flex;align-items:flex-end;padding:calc(var(--hdr) + 80px) 0 56px;color:var(--on-d);isolation:isolate;overflow:hidden;background:var(--ink)}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 16s ease-out both}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,18,21,.92) 6%,rgba(4,18,21,.35) 60%,rgba(4,18,21,.6) 100%)}
.phero .wrap{width:100%;display:grid;gap:14px}
.phero h1{font:400 clamp(46px,7vw,92px)/1 var(--f-d);letter-spacing:-.015em}
.phero p{max-width:58ch;font-size:18px;color:#d8e3e2}
.crumb{font:500 12px var(--f-u);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:none}

/* tour detail */
.tdet{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:900px){.tdet{grid-template-columns:1fr}}
.itin{list-style:none;margin:0;padding:0;border-left:2px dotted var(--goldd);display:grid;gap:20px}
.itin li{padding-left:24px;position:relative}
.itin li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--goldd)}
.itin b{display:block;font:600 18px var(--f-b)}
.itin span{color:var(--muted);font-size:15px}
.itin .t{font:500 13px var(--f-u);color:var(--goldd)}
.sticky{position:sticky;top:calc(var(--hdr) + 20px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.total b{font:600 38px/1 var(--f-u);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.check span{flex:1}
.check em{font-style:normal;font:500 13px var(--f-u);color:var(--goldd)}
.seg2{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.seg2 button{border:0;background:none;min-height:40px;padding:0 16px;border-radius:999px;font:600 13px var(--f-b);color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--gold2)}

/* booking */
.stepper{display:flex;gap:6px;margin-bottom:22px}
.stepper span{flex:1;display:grid;gap:8px;font:500 11px var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--no)}
.stepper span::before{content:"";height:3px;border-radius:3px;background:var(--line)}
.stepper span.on{color:var(--text)} .stepper span.on::before{background:var(--ink)}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:#6b4300}
.card-demo{display:grid;gap:12px;padding:18px;border-radius:14px;background:var(--ink);color:var(--on-d)}
.card-demo .fld input{background:rgba(255,255,255,.06);border-color:var(--line-d);color:var(--on-d)}
.card-demo .fld label{color:var(--muted-d)}
.done{text-align:center;display:grid;gap:16px;justify-items:center;padding:30px 0}
.tick-c{width:84px;height:84px;border-radius:50%;background:var(--ink);display:grid;place-items:center}

.bad{color:#b4231a;font-size:14px}
.mbar{display:none}
@media (max-width:900px){

}

/* faq */
.faq{display:grid;max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;font:600 18px var(--f-b);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:15px;font-size:26px;color:var(--goldd);transition:transform .5s var(--spring)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 20px;color:var(--muted);max-width:70ch}

/* floating */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;display:grid;gap:10px}

.fab svg{width:26px;height:26px;fill:#fff}
.fab .wa{background:#1f9f55} .fab .vb{background:#6f4fd1}

.demo .seg button{border:0;background:none;border-radius:999px;min-height:30px;padding:0 10px;font:600 12px var(--f-b);white-space:nowrap}

.demo a{font-weight:700;padding:0 8px;white-space:nowrap}

const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const hrs = h => { const H = Math.floor(h), M = Math.round((h - H) * 60); return H + 'h' + (M ? ' ' + M + 'm' : ''); };

let P = Object.assign({ port: 'rhodes', arr: '08:00', dep: '17:00' }, store.get('plan', {}));
const savePlan = () => store.set('plan', P);
function fit(t) {
  const ashore = toMin(P.dep) - toMin(P.arr);
  const start = toMin(P.arr) + 30;                  // 30 min to get off the ship
  const end = start + t.h * 60;
  const latest = toMin(P.dep) - D.buffer;           // back on board an hour before all aboard
  const spare = latest - end;
  return { ashore, start, end, spare, ok: spare >= 0, tight: spare >= 0 && spare < 45 };
}
function timeline(t, f) {
  const a = toMin(P.arr), b = toMin(P.dep), span = Math.max(60, b - a);
  const pct = m => Math.max(0, Math.min(100, (m - a) / span * 100));
  const l = pct(f.start), w = Math.max(2, pct(f.end) - l);
  return `<div class="tl" aria-hidden="true"><div class="track"></div><div class="seg" style="left:${l}%;width:${w}%"></div>
    <span class="tick" style="left:0;translate:0 0">${fmt(a)}</span><span class="tick" style="left:${pct(f.end)}%">${fmt(f.end)}</span><span class="tick end" style="left:100%;translate:-100% 0">${L('All aboard', 'Επιβίβαση')} ${fmt(b)}</span></div>`;
}
function fitRow(t) {
  const f = fit(t);
  const cls = f.ok ? (f.tight ? 'tight' : '') : 'no';
  const st = f.ok ? (f.tight ? L(`Fits, back on board at ${fmt(f.end + 0)} with ${D.buffer + f.spare} min to spare`, `Χωράει, επιστροφή ${fmt(f.end)}, ${D.buffer + f.spare}′ περιθώριο`) : L(`Back at ${fmt(f.end)}, ${Math.floor((D.buffer + f.spare) / 60)}h ${(D.buffer + f.spare) % 60}m before all aboard`, `Επιστροφή ${fmt(f.end)}, ${Math.floor((D.buffer + f.spare) / 60)}ω ${(D.buffer + f.spare) % 60}′ πριν την επιβίβαση`)) : L(`Needs ${-f.spare} more minutes in port`, `Χρειάζεται ${-f.spare}′ ακόμα`);
  return `<a class="fit ${cls}" href="#tour-${t.id}"><img src="/ges-private-tours/img/${t.img}.jpg" alt="" loading="lazy"><div style="min-width:0"><h3>${esc(nm(t))}</h3><span class="status">${st}</span>${timeline(t, f)}</div><div class="pr"><b>${priceTxt(t.p4)}</b><small>${hrs(t.h)} · ${L('up to 4', 'έως 4')}</small></div></a>`;
}
const priceTxt = n => mode === 'pay' ? eur(n) : L('from ', 'από ') + eur(n);
function ashoreBox() {

  return `<div class="ashore" id="ashore"><b>${hrs(a / 60)}</b><span>${L(`ashore in ${nm(portOf(P.port))}. We plan every tour to have you back ${D.buffer} minutes before all aboard.`, `στη στεριά, ${nm(portOf(P.port))}. Κάθε εκδρομή τελειώνει ${D.buffer} λεπτά πριν την επιβίβαση.`)}</span></div>`;
}

/* ---------- router ---------- */
let view = 'home';
function render(top = true) {
  const h = (location.hash || '#home').slice(1);
  if (h !== 'main') view = h || 'home';
  const [base, sub] = view.startsWith('tour-') ? ['tour', view.slice(5)] : view.startsWith('port-') ? ['port', view.slice(5)] : [view, null];
  chrome(view);
  $('#main').innerHTML = (V[base] || V.home)(sub);
  $('#hdr').classList.toggle('always', ['book', 'admin'].includes(base));
  document.body.classList.toggle('has-mbar', base === 'book' && mode === 'pay' && B.step < 4);
  document.title = (base === 'home' ? 'G.E.S Private Tours · ' + L('Private shore excursions in every Greek port', 'Ιδιωτικές εκδρομές σε κάθε ελληνικό λιμάνι') : ($('#main h1')?.textContent.trim() || '') + ' · G.E.S Private Tours');
  if (top) window.scrollTo({ top: 0, behavior: 'instant' });
  rise(); hdr(); drawTL();
}
function softRender() { const y = scrollY, id = document.activeElement?.id; render(false); document.querySelectorAll('[data-rise]').forEach(e => e.classList.add('in')); window.scrollTo({ top: y, behavior: 'instant' }); if (id && document.getElementById(id)) document.getElementById(id).focus({ preventScroll: true }); }
let io;
function rise() { io?.disconnect(); io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' }); document.querySelectorAll('[data-rise]').forEach(e => io.observe(e)); }
const hdr = () => $('#hdr').classList.toggle('solid', scrollY > 30);
addEventListener('scroll', hdr, { passive: true });
addEventListener('hashchange', () => { if (location.hash !== '#main') render(); });
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
function need(o, errSel) {
  const miss = [];
  if ((o.name || '').trim().length < 2) miss.push(L('your name', 'όνομα'));
  if (!emailOk((o.email || '').trim())) miss.push(L('a valid email', 'σωστό email'));
  const e = $(errSel); if (!e) return true;
  if (miss.length) { e.hidden = false; e.textContent = L('Please add ', 'Συμπληρώστε ') + miss.join(L(' and ', ' και ')) + '.'; return false; }
  e.hidden = true; return true;
}
function addBooking(status, o) {
  const t = tourOf(o.tour) || D.tours[0], total = tourTotal(t);
  D.bookings.unshift({ ref: 'GES-' + (1043 + D.bookings.length), name: o.name.trim().slice(0, 80), tour: t.id, date: o.date || P.date || tomorrow(), ship: (o.ship || '').slice(0, 40), guests: o.guests || 2, total, paid: status === 'paid' ? Math.round(total * D.deposit / 100) : 0, status });
  save();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.lang) { lang = t.dataset.lang; store.set('lang', lang); softRender(); return; }
  if (t.dataset.mode) { mode = t.dataset.mode; store.set('mode', mode); if (B.step > 1) B.step = 1; saveB(); softRender(); toast(mode === 'pay' ? L('Showing online payment with deposit (+€170)', 'Online πληρωμή με προκαταβολή (+€170)') : L('Showing the request form', 'Φόρμα αιτήματος')); return; }
  if (t.dataset.book) { B.tour = t.dataset.book; B.step = 1; B.guests = G > 4 ? 6 : 2; saveB(); }
  if (t.dataset.tmPort) { TM.port = t.dataset.tmPort; store.set('tm', TM); }
  if (t.id === 'burger') { $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); t.setAttribute('aria-expanded', 'true'); $('#drawerClose').focus(); return; }
  if (t.id === 'drawerClose' || t.closest('#drawerLinks')) { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#burger').setAttribute('aria-expanded', 'false'); }
  if (t.dataset.g) { G = +t.dataset.g; store.set('group', G); softRender(); return; }
  if (t.dataset.like) { const k = t.dataset.like; TM.likes = TM.likes.includes(k) ? TM.likes.filter(x => x !== k) : [...TM.likes, k]; store.set('tm', TM); t.setAttribute('aria-pressed', TM.likes.includes(k)); return; }
  if (t.dataset.pace) { TM.pace = t.dataset.pace; store.set('tm', TM); t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (t.id === 'back') { B.step--; saveB(); softRender(); return; }
  if (t.id === 'mnext') { $('#bform').requestSubmit(); return; }
  if (t.id === 'again') { B.step = 1; saveB(); location.hash = '#ports'; return; }
  if (t.dataset.atab) { admin.tab = t.dataset.atab; softRender(); return; }
  if (t.id === 'logout') { admin.in = false; store.set('admin', false); render(); return; }
  if (t.id === 'reset') { D = structuredClone(DEFAULTS); save(); softRender(); toast(L('Demo data reset', 'Επαναφορά δεδομένων')); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer').classList.contains('open')) $('#drawerClose').click(); });
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') $('#drawerClose').click(); });
document.addEventListener('input', e => {
  const el = e.target, v = el.type === 'checkbox' ? el.checked : el.dataset.num !== undefined ? +el.value : el.value;

  if (f.id === 'portform') { const en = $('#np-en').value.trim(), el = $('#np-el').value.trim() || en, err = $('#np-err');
    if (en.length < 2) { err.hidden = false; err.textContent = L('Add the port name.', 'Συμπληρώστε το όνομα.'); return; }
    const id = 'p-' + Date.now().toString(36); D.ports.push({ id, img: $('#np-img').value, en: en.slice(0, 40), el: el.slice(0, 40), pen: '', pel: '', arr: '08:00', dep: '17:00' }); save(); softRender(); toast(L('Port added. Add its first tour next.', 'Το λιμάνι προστέθηκε.')); return; }
});
render(false);
})();
</script>
