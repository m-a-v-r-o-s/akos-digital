<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08132b">
<title>Aspire Transfer & Tours · Private transfers in Athens</title>
<meta name="description" content="Private Mercedes transfers from Athens Airport, Piraeus, Rafina and Lavrio ports, plus day tours to Sounion, Delphi and beyond. Fixed prices, 24/7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Golden Hour: dusk navy ground, gold used like light on paint. Tracked capitals from their IG posts. */
:root{
  --navy:#08132b; --navy2:#0d1d3d; --navy3:#13284f; --line:rgba(255,255,255,.09);
  --gold:#c9a45c; --gold2:#e4c98a; --goldgrad:linear-gradient(135deg,#ecd59c 0%,#c9a45c 55%,#a8823f 100%);
  --ink:#eef1f6; --muted:#a3adc4; --dim:#76819b; --ok:#5fc59a; --err:#ff8a7a;
  --f-d:"Jost",system-ui,sans-serif; --f-b:"Manrope",system-ui,sans-serif; --f-m:"DM Mono",ui-monospace,monospace;
  --spring:linear(0,.178 4.2%,.531 10.6%,.787 17.3%,.931 24.5%,.986 31.7%,1.003 40%,1.004 52%,1);
  --r:14px; --hdr:72px;
  --gx:max(20px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:var(--ink);font:16px/1.65 var(--f-b);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:300;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gx);padding-right:max(20px,env(safe-area-inset-right,0px))}
.ey{font:500 12px/1.2 var(--f-d);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.caps{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.14em;font-weight:300}
.gold{color:var(--gold2)}
.mono{font-family:var(--f-m)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid transparent;font:500 15px var(--f-d);letter-spacing:.08em;text-decoration:none;transition:transform .5s var(--spring),background .3s,border-color .3s;touch-action:manipulation;user-select:none}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn-gold{background:var(--goldgrad);color:var(--navy)}
.btn-ghost{border-color:rgba(201,164,92,.55);color:var(--gold2);background:transparent}
.btn-ghost:hover{background:rgba(201,164,92,.1)}
.btn[disabled]{opacity:.4;pointer-events:none}
section{padding-block:clamp(64px,9vw,120px)}
.sec-h{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,48px);max-width:720px}
.sec-h h2{font-size:clamp(30px,4.2vw,50px);line-height:1.08;letter-spacing:.06em;text-transform:uppercase}
.sec-h p{color:var(--muted);font-size:17px}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
header.site{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
header.site.solid{background:rgba(8,19,43,.86);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-color:var(--line)}
.hdr{height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{width:118px;height:auto}
nav.main{display:flex;gap:30px;font:400 13px var(--f-d);letter-spacing:.2em;text-transform:uppercase}
nav.main a{text-decoration:none;opacity:.82;padding:8px 0;position:relative}
nav.main a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--gold);transition:right .5s var(--spring)}
nav.main a:hover,nav.main a[aria-current="page"]{opacity:1}
nav.main a:hover::after,nav.main a[aria-current="page"]::after{right:0}
.hdr-r{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;min-width:40px;min-height:32px;border-radius:999px;font:500 12px var(--f-d);letter-spacing:.12em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:rgba(201,164,92,.16);color:var(--gold2)}
.hdr .btn{min-height:42px;padding:0 20px;font-size:13px}
.burger{display:none;background:none;border:1px solid var(--line);width:44px;height:44px;border-radius:50%;place-items:center}
.burger span{display:block;width:16px;height:1px;background:var(--ink);box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink)}
@media (max-width:980px){nav.main,.hdr .btn{display:none}.burger{display:grid}}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(4,10,24,.6);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer.open{opacity:1;pointer-events:auto}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(86vw,360px);background:var(--navy2);padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 26px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:transform .6s var(--spring);border-left:1px solid var(--line)}
.drawer.open .panel{transform:none}
.drawer a{font:300 26px/1.2 var(--f-d);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.drawer .close{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:20px;margin-bottom:12px}

/* reveal */
.js [data-rise]{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1.1s var(--spring)}
.js [data-rise].in{opacity:1;transform:none}

/* hero */
.hero{position:relative;min-height:max(680px,100svh);display:flex;align-items:flex-end;padding:calc(var(--hdr) + 40px) 0 40px;overflow:hidden;isolation:isolate}
.hero-media{position:absolute;inset:0 0 0 auto;width:62%;z-index:-2;overflow:hidden}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:60% 40%;animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--navy) 36%,rgba(8,19,43,.75) 50%,rgba(8,19,43,0) 75%),linear-gradient(0deg,var(--navy) 6%,rgba(8,19,43,0) 42%)}
.hero .wrap{width:100%;display:grid;gap:44px}
.hero-copy{display:grid;gap:22px;max-width:760px}
.hero h1{font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:.1em;text-transform:uppercase}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,#c9a45c 0%,#c9a45c 40%,#fff3cf 50%,#c9a45c 60%,#c9a45c 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out 1.2s infinite}
@keyframes sheen{0%{background-position:100% 0}45%,100%{background-position:0 0}}
.hero .lede{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:46ch}
@media (max-width:820px){
  .hero{min-height:auto;padding-top:calc(var(--hdr) + 46vw)}
  .hero-media{width:100%;height:78vw;inset:0 0 auto 0}
  .hero::before{background:linear-gradient(180deg,rgba(8,19,43,.5) 0%,rgba(8,19,43,0) 22%,rgba(8,19,43,.55) 46%,var(--navy) 62%)}
}

/* booking bar */
.bbar{display:grid;grid-template-columns:1.35fr 1.35fr 1fr .8fr .7fr auto;background:rgba(13,29,61,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(201,164,92,.35);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.bf{display:grid;gap:2px;padding:14px 18px;border-right:1px solid var(--line);min-width:0;position:relative}
.bf label{font:500 10.5px var(--f-d);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.bf select,.bf input{background:transparent;border:0;padding:2px 0;font-size:16px;width:100%;min-width:0;appearance:none;-webkit-appearance:none;color:var(--ink)}
.bf select option{background:var(--navy2)}
.bf input::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(1) saturate(3) hue-rotate(5deg);opacity:.7}
.bbar .go{border:0;border-radius:0;min-height:auto;padding:0 30px;font-size:16px;white-space:nowrap}
.bbar .go b{font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:1060px){.bbar{grid-template-columns:1fr 1fr}.bf:nth-child(2n){border-right:0}.bf{border-bottom:1px solid var(--line)}.bbar .go{grid-column:1/-1;min-height:58px}}
@media (max-width:560px){.bf:nth-child(1),.bf:nth-child(2),.bf:nth-child(5){grid-column:1/-1;border-right:0}.bf:nth-child(3){border-right:1px solid var(--line)}}
.trust{display:flex;flex-wrap:wrap;gap:10px 34px;font:400 12px var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:10px}
.trust svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.svc{grid-template-columns:1fr}}
.card-img{position:relative;border-radius:var(--r);overflow:hidden;text-decoration:none;min-height:420px;display:flex;align-items:flex-end;isolation:isolate;border:1px solid var(--line)}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.card-img::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(8,19,43,.95) 8%,rgba(8,19,43,.1) 62%)}
.card-img:hover img{transform:scale(1.06)}
.card-img .in{padding:26px;display:grid;gap:8px}
.card-img h3{font-size:28px;letter-spacing:.1em;text-transform:uppercase}
.card-img p{color:var(--muted);font-size:15px}
.card-img .from{font:500 13px var(--f-d);letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}
@media (max-width:860px){.card-img{min-height:300px}}

/* fare board */
.board{border-top:1px solid var(--gold)}
.board a{display:grid;grid-template-columns:1fr auto 110px 40px;gap:20px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .3s,padding .5s var(--spring)}
.board a:hover{background:rgba(201,164,92,.06);padding-left:14px}
.board .rt{font:300 clamp(18px,2.2vw,24px) var(--f-d);letter-spacing:.04em}
.board .rt span{color:var(--gold)}
.board .t{font:13px var(--f-m);color:var(--dim)}
.board .p{font:500 20px var(--f-m);text-align:right;color:var(--gold2);font-variant-numeric:tabular-nums}
.board .arr{color:var(--gold);font-size:20px;text-align:right}
@media (max-width:640px){.board a{grid-template-columns:1fr auto;gap:4px 14px}.board .t{grid-column:1;grid-row:2}.board .p{grid-row:1/3;grid-column:2}.board .arr{display:none}}

/* fleet strip */
.fleet{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
@media (max-width:860px){.fleet{grid-template-columns:1fr}}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:240px 240px;gap:12px}
.mosaic img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.mosaic img:first-child{grid-row:span 2}
@media (max-width:560px){.mosaic{grid-template-rows:170px 170px}}
.specs{display:grid;gap:24px}
.spec-row{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec-row div{padding:18px 0;display:grid;gap:2px}
.spec-row div+div{padding-left:18px;border-left:1px solid var(--line)}
.spec-row b{font:300 34px/1 var(--f-d);color:var(--gold2)}
.spec-row small{font:500 11px var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* tours */
.tours{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:960px){.tours{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.tours{grid-template-columns:1fr}}
.tour{border-radius:var(--r);overflow:hidden;background:var(--navy2);border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;transition:transform .6s var(--spring),border-color .3s}
.tour:hover{transform:translateY(-4px);border-color:rgba(201,164,92,.45)}
.tour .ph{aspect-ratio:3/2;overflow:hidden}
.tour .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.tour:hover .ph img{transform:scale(1.06)}
.tour .bd{padding:20px 22px 22px;display:grid;gap:8px;flex:1}
.tour h3{font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.tour .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.tour .meta b{font:500 18px var(--f-m);color:var(--gold2)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{padding:28px 28px 28px 0;display:grid;gap:10px}
.step+.step{padding-left:28px;border-left:1px solid var(--line)}
@media (max-width:760px){.step+.step{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.step .n{font:300 54px/1 var(--f-d);color:var(--gold)}
.step h3{font-size:21px;letter-spacing:.08em;text-transform:uppercase}
.step p{color:var(--muted);font-size:15px}

/* ig */
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:760px){.ig{grid-template-columns:repeat(3,1fr)}}
.ig a{aspect-ratio:3/4;overflow:hidden;border-radius:8px;position:relative}
.ig img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .4s}
.ig a:hover img{transform:scale(1.07);filter:brightness(.75)}

/* faq */
.faq{display:grid;max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font:300 20px var(--f-d);letter-spacing:.03em;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:18px;font-size:26px;color:var(--gold);transition:transform .5s var(--spring)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;color:var(--muted);max-width:70ch}

/* contact band */
.band{background:linear-gradient(180deg,var(--navy2),var(--navy));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
@media (max-width:860px){.band-grid{grid-template-columns:1fr}}
.people{display:grid;gap:12px}
.person{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.02)}
.person b{font:400 22px var(--f-m);letter-spacing:.02em;color:var(--ink);text-decoration:none}
.person small{display:block;color:var(--gold);font:500 11px var(--f-d);letter-spacing:.24em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font:500 13px var(--f-d);letter-spacing:.06em}
.chip svg{width:18px;height:18px}
.chip.wa{background:#1f9f55;border-color:#1f9f55;color:#fff}
.chip.vb{background:#6f4fd1;border-color:#6f4fd1;color:#fff}

/* page hero (inner pages) */
.phero{position:relative;padding:calc(var(--hdr) + 90px) 0 64px;overflow:hidden;isolation:isolate;min-height:460px;display:flex;align-items:flex-end}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 16s ease-out both}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--navy) 4%,rgba(8,19,43,.55) 55%,rgba(8,19,43,.7) 100%)}
.phero .wrap{width:100%;display:grid;gap:16px}
.phero h1{font-size:clamp(36px,5.4vw,72px);line-height:1.04;letter-spacing:.1em;text-transform:uppercase;max-width:16ch}
.phero p{color:var(--muted);max-width:56ch;font-size:18px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.list{display:grid;gap:18px;padding:0;margin:0;list-style:none}
.list li{display:grid;grid-template-columns:28px 1fr;gap:14px}
.list svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.5;margin-top:3px}
.list b{display:block;font:400 18px var(--f-d);letter-spacing:.04em}
.list span{color:var(--muted);font-size:15px}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,32px)}

.ports{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.ports{grid-template-columns:1fr}}
.port{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--navy2)}
.port .ph{aspect-ratio:16/10;overflow:hidden}
.port .ph img{width:100%;height:100%;object-fit:cover}
.port .bd{padding:22px;display:grid;gap:10px}
.port h3{font-size:24px;letter-spacing:.1em;text-transform:uppercase}
.port ul{list-style:none;margin:6px 0 0;padding:0;display:grid}
.port li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.port li b{font:500 15px var(--f-m);color:var(--gold2)}

.vehicles{display:grid;gap:22px}
.veh{display:grid;grid-template-columns:1fr 1.1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--navy2)}
@media (max-width:860px){.veh{grid-template-columns:1fr}}
.veh .ph{min-height:320px;position:relative}
.veh .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veh .bd{padding:clamp(22px,3vw,36px);display:grid;gap:16px;align-content:center}
.veh h3{font-size:clamp(26px,3vw,36px);letter-spacing:.08em;text-transform:uppercase}
.veh ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px}

.tdetail{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:900px){.tdetail{grid-template-columns:1fr}}
.itin{list-style:none;margin:0;padding:0;border-left:1px dashed var(--gold);display:grid;gap:22px}
.itin li{padding-left:24px;position:relative}
.itin li::before{content:"";position:absolute;left:-6px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--navy);border:2px solid var(--gold)}
.itin b{display:block;font:400 19px var(--f-d);letter-spacing:.04em}
.itin span{color:var(--muted);font-size:15px}
.sticky-card{position:sticky;top:calc(var(--hdr) + 24px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* booking app */
.book{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
@media (max-width:960px){.book{grid-template-columns:1fr}}
.stepper{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.stepper span{flex:1;min-width:64px;display:grid;gap:8px;font:500 11px var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stepper span::before{content:"";height:3px;border-radius:3px;background:var(--line);transition:background .4s}
.stepper span.on{color:var(--gold2)} .stepper span.on::before{background:var(--goldgrad)}
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);margin-bottom:20px;gap:2px;flex-wrap:wrap}

const STEPS_BOOK = () => [L('Trip', 'Διαδρομή'), L('Vehicle', 'Όχημα'), L('Details', 'Στοιχεία'), L('Payment', 'Πληρωμή')];
function tripFields() {
  const tabs = `<div class="tabs" role="group" aria-label="${L('Trip type', 'Τύπος')}">${[['transfer', L('Transfer', 'Μεταφορά')], ['hourly', L('By the hour', 'Με την ώρα')], ['tour', L('Day tour', 'Εκδρομή')]].map(([k, l]) => `<button type="button" data-kind="${k}" aria-pressed="${T.kind === k}">${l}</button>`).join('')}</div>`;
  let main = '';
  if (T.kind === 'transfer') main = `<div class="route-f"><div class="fld"><label for="b-from">${L('Pickup', 'Παραλαβή')}</label><select id="b-from" data-f="from">${placeOpts(T.from)}</select></div><button class="swap" type="button" id="swap" aria-label="${L('Swap pickup and drop off', 'Αντιστροφή')}">⇅</button><div class="fld"><label for="b-to">${L('Drop off', 'Προορισμός')}</label><select id="b-to" data-f="to">${placeOpts(T.to)}</select></div></div>`;
  if (T.kind === 'hourly') main = `<div class="grid2"><div class="fld"><label for="b-from">${L('Pickup', 'Παραλαβή')}</label><select id="b-from" data-f="from">${placeOpts(T.from)}</select></div><div class="fld"><label for="b-hours">${L('Hours', 'Ώρες')}</label><select id="b-hours" data-f="hours" data-num>${[3,4,5,6,8,10,12].map(h => `<option${h === T.hours ? ' selected' : ''}>${h}</option>`).join('')}</select></div></div>`;
  if (T.kind === 'tour') main = `<div class="fld"><label for="b-tour">${L('Tour', 'Εκδρομή')}</label><select id="b-tour" data-f="tour">${D.tours.filter(t => t.on).map(t => `<option value="${t.id}"${t.id === T.tour ? ' selected' : ''}>${esc(t[lang])} · ${t.h}h</option>`).join('')}</select></div>`;
  const airportPickup = T.kind === 'transfer' && T.from === 'ath';

  return `${tabs}<div style="display:grid;gap:12px">${main}
    <div class="grid2"><div class="fld"><label for="b-date">${L('Date', 'Ημερομηνία')}</label><input id="b-date" type="date" data-f="date" value="${T.date}" min="${tomorrow()}"></div><div class="fld"><label for="b-time">${airportPickup ? L('Landing time', 'Ώρα προσγείωσης') : L('Pickup time', 'Ώρα παραλαβής')}</label><input id="b-time" type="time" data-f="time" value="${T.time}"></div></div>
    ${airportPickup ? `<div class="fld"><label for="b-flight">${L('Flight number', 'Αριθμός πτήσης')}</label><input id="b-flight" data-f="flight" value="${esc(T.flight)}" placeholder="A3 651" maxlength="10" autocapitalize="characters" style="font-family:var(--f-m)"><span class="hint">${L('We track it, so a delay never costs you extra.', 'Την παρακολουθούμε, η καθυστέρηση δεν κοστίζει.')}</span></div>` : ''}
    ${portPickup ? `<div class="fld"><label for="b-flight">${L('Ship name', 'Όνομα πλοίου')}</label><input id="b-flight" data-f="flight" value="${esc(T.flight)}" placeholder="Blue Star Delos" maxlength="40"></div>` : ''}
    <div class="grid2"><div class="fld"><span class="lbl" id="l-pax">${L('Guests', 'Άτομα')}</span><div class="stepbox" role="group" aria-labelledby="l-pax"><button type="button" data-inc="pax,-1" aria-label="${L('Fewer guests', 'Λιγότερα')}">−</button><output>${T.pax}</output><button type="button" data-inc="pax,1" aria-label="${L('More guests', 'Περισσότερα')}">+</button></div></div>
    <div class="fld"><span class="lbl" id="l-bags">${L('Suitcases', 'Βαλίτσες')}</span><div class="stepbox" role="group" aria-labelledby="l-bags"><button type="button" data-inc="bags,-1" aria-label="${L('Fewer suitcases', 'Λιγότερες')}">−</button><output>${T.bags}</output><button type="button" data-inc="bags,1" aria-label="${L('More suitcases', 'Περισσότερες')}">+</button></div></div></div>
  </div>`;
}
function vehicleStep() {
  const premOk = T.pax <= 7 && T.bags <= 6;
  if (!premOk && T.cls === 'premium') T.cls = 'comfort';
  const v = (cls, img, name, sub, ok) => { const q = quote({ ...T, cls, stop: false }); return `<button type="button" class="vcard" data-cls="${cls}" aria-pressed="${T.cls === cls}"${ok ? '' : ' disabled'}><img src="/aspire-transfer/img/${img}.jpg" alt=""><span><b>${name}</b><small>${sub}</small></span><span class="pr">${eur(q.total)}</span></button>`; };
  return `<div class="vcards" role="group" aria-label="${L('Vehicle', 'Όχημα')}">
    ${v('premium', 'grille', 'Premium · Mercedes V-Class', L('7 seats · 6 suitcases', '7 θέσεις · 6 βαλίτσες') + (premOk ? '' : ' · ' + L('too small for your group', 'μικρό για την ομάδα σας')), premOk)}
    ${v('comfort', 'villa', 'Comfort · Vito / Multivan', L('8 seats · 8 suitcases', '8 θέσεις · 8 βαλίτσες'), true)}
  </div>
  <div class="extras">
    <label class="check"><input type="checkbox" data-f="child"${T.child ? ' checked' : ''}><span>${L('Child seat', 'Παιδικό κάθισμα')}</span><em>${L('free', 'δωρεάν')}</em></label>
    ${T.kind === 'transfer' ? `<label class="check"><input type="checkbox" data-f="stop"${T.stop ? ' checked' : ''}><span>${L('Extra stop on the way (up to 15 min)', 'Ενδιάμεση στάση (έως 15 λεπτά)')}</span><em>+€15</em></label>` : ''}
  </div>`;
}

    <div class="fld"><label for="b-name">${L('Full name', 'Ονοματεπώνυμο')}</label><input id="b-name" data-f="name" value="${esc(T.name)}" autocomplete="name" required maxlength="80"></div>

    <p class="bad" id="d-err" hidden style="color:var(--err);font-size:14px"></p>
  </div>`;
}
function payStep() {
  const q = quote(T);
  return `<div style="display:grid;gap:16px">
    <div class="notice">${I.shield.replace('<svg', '<svg width="20" height="20" style="flex:none;stroke:currentColor;fill:none;stroke-width:1.6"')}<span>${L('Mockup: no card is charged and nothing is sent. The live site uses Stripe, so card numbers never touch our server.', 'Mockup: δεν χρεώνεται κάρτα και δεν αποστέλλεται τίποτα. Το κανονικό site χρησιμοποιεί Stripe.')}</span></div>
    <div class="card-demo"><div class="fld"><label for="p-card">${L('Card number', 'Αριθμός κάρτας')}</label><input id="p-card" inputmode="numeric" value="4242 4242 4242 4242" readonly style="font-family:var(--f-m)"></div>
    <div class="grid2"><div class="fld"><label for="p-exp">${L('Expiry', 'Λήξη')}</label><input id="p-exp" value="12 / 29" readonly style="font-family:var(--f-m)"></div><div class="fld"><label for="p-cvc">CVC</label><input id="p-cvc" value="123" readonly style="font-family:var(--f-m)"></div></div></div>
    <dl class="kv"><dt>${L('Deposit now', 'Προκαταβολή τώρα')} (${D.deposit}%)</dt><dd class="mono gold">${eur(q.deposit)}</dd><dt>${L('To the driver', 'Στον οδηγό')}</dt><dd class="mono">${eur(q.total - q.deposit)}</dd></dl>
  </div>`;
}
function summary() {
  const q = quote(T);
  const a = PLACES[T.from] || PLACES.ath, b = T.kind === 'transfer' ? (PLACES[T.to] || PLACES.centre) : a;
  const mx = (a.x + b.x) / 2, my = Math.min(a.y, b.y) - 50;
  const path = T.kind === 'transfer' ? `M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}` : `M${a.x} ${a.y} m-40 0 a40 40 0 1 0 80 0 a40 40 0 1 0 -80 0`;
  const when = T.date ? new Date(T.date + 'T12:00').toLocaleDateString(lang === 'el' ? 'el-GR' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  return `<div class="rmap" id="rmap"><svg viewBox="0 0 480 320" role="img" aria-label="${esc(q.label)}"><rect width="480" height="320" fill="#0a1834"/>
    <path d="M0 190 C40 170 80 200 110 186 S170 214 190 236 S260 262 300 300 L330 320 L0 320Z" fill="#071228"/><path d="M0 190 C40 170 80 200 110 186 S170 214 190 236 S260 262 300 300 L330 320" fill="none" stroke="#1d3563" stroke-width="2"/>

/* ---------- router ---------- */
let view = 'home';
function render(scrollTop = true) {
  const h = (location.hash || '#home').slice(1);
  view = h === 'main' ? view : (h || 'home');
  const [base, sub] = view.startsWith('tour-') ? ['tour', view.slice(5)] : [view, null];
  const fn = V[base] || V.home;
  chrome(view);
  $('#main').innerHTML = fn(sub);
  document.body.classList.toggle('has-mbar', base === 'book' && mode === 'book' && T.step < 5);
  document.title = (base === 'home' ? 'Aspire Transfer & Tours · ' + L('Private transfers in Athens', 'Ιδιωτικές μεταφορές στην Αθήνα') : ($('#main h1')?.textContent.trim() || '') + ' · Aspire Transfer & Tours');
  if (scrollTop) window.scrollTo({ top: 0, behavior: 'instant' });
  rise(); hdr(); afterRender(base);
}
function afterRender(base) {
  if (base === 'home') updateQuick();
  if (base === 'book') { requestAnimationFrame(() => requestAnimationFrame(() => $('#rmap')?.classList.add('drawn'))); countUp(); }
}
function rerenderBooking() { // re-render booking without scrolling, keep focus
  const id = document.activeElement?.id;
  $('#main').innerHTML = V.book();
  document.body.classList.toggle('has-mbar', mode === 'book' && T.step < 5);
  $('#main').querySelectorAll('[data-rise]').forEach(e => e.classList.add('in'));
  $('#rmap')?.classList.add('drawn');
  if (id && document.getElementById(id)) document.getElementById(id).focus({ preventScroll: true });
  countUp();
}
function refreshSummary() { const s = $('#sum'); if (!s) return; s.innerHTML = summary(); $('#rmap').classList.add('drawn'); const mb = $('#mbar b'); if (mb) mb.textContent = eur(quote(T).total); countUp(); }
function countUp() {
  const el = $('#tot'); if (!el) return;
  const to = +el.dataset.v, from = lastTotal || to; lastTotal = to;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now();
  const tick = t => { const k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3); el.textContent = eur(from + (to - from) * e); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function updateQuick() {
  const go = $('#qgo'); if (!go) return;
  const p = transferPrice($('#qf').value, $('#qt').value, 'premium', $('#qh').value);
  go.innerHTML = mode === 'book' ? (p ? `<b>${eur(p)}</b>&nbsp;·&nbsp;${L('Book', 'Κράτηση')}` : L('Book', 'Κράτηση')) : L('Request a quote', 'Ζητήστε τιμή');
}
let io;
function rise() {
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('[data-rise]').forEach(e => io.observe(e));
}
const hdr = () => $('#hdr').classList.toggle('solid', scrollY > 30 || !['home'].includes(view.split('-')[0]) && false || scrollY > 30);
addEventListener('scroll', hdr, { passive: true });
addEventListener('hashchange', () => { if (location.hash !== '#main') render(); });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.lang) { lang = t.dataset.lang; store.set('lang', lang); render(false); return; }
  if (t.dataset.mode) { mode = t.dataset.mode; store.set('mode', mode); if (T.step === 5) T.step = 1; render(false); toast(mode === 'book' ? L('Showing online booking with deposit (+€160)', 'Online κράτηση με προκαταβολή (+€160)') : L('Showing the request form (included)', 'Φόρμα αιτήματος (περιλαμβάνεται)')); return; }
  if (t.dataset.route) { const [a, b] = t.dataset.route.split(','); Object.assign(T, { kind: 'transfer', from: a, to: b, step: 1 }); saveTrip(); }
  if (t.dataset.tour) { Object.assign(T, { kind: 'tour', tour: t.dataset.tour, step: 1 }); saveTrip(); }
  if (t.id === 'burger') { $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); t.setAttribute('aria-expanded', 'true'); $('#drawerClose').focus(); return; }
  if (t.id === 'drawerClose' || t.closest('#drawerLinks')) { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#burger').setAttribute('aria-expanded', 'false'); }
  if (t.dataset.kind) { T.kind = t.dataset.kind; saveTrip(); rerenderBooking(); return; }
  if (t.id === 'swap') { [T.from, T.to] = [T.to, T.from]; saveTrip(); rerenderBooking(); return; }
  if (t.dataset.inc) { const [k, d] = t.dataset.inc.split(','); T[k] = Math.max(k === 'pax' ? 1 : 0, Math.min(k === 'pax' ? 8 : 10, T[k] + +d)); saveTrip(); t.parentElement.querySelector('output').textContent = T[k]; refreshSummary(); return; }
  if (t.dataset.cls && !t.disabled) { T.cls = t.dataset.cls; saveTrip(); rerenderBooking(); return; }
  if (t.id === 'back') { T.step--; saveTrip(); rerenderBooking(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.id === 'mnext') { $('#bform').requestSubmit(); return; }
  if (t.id === 'again') { T.step = 1; saveTrip(); render(); return; }
  if (t.dataset.atab) { admin.tab = t.dataset.atab; render(false); return; }
  if (t.id === 'logout') { admin.in = false; store.set('admin', false); render(); return; }
  if (t.id === 'reset') { D = structuredClone(DEFAULTS); save(); render(false); toast(L('Demo data reset', 'Επαναφορά δεδομένων')); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer').classList.contains('open')) $('#drawerClose').click(); });
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') $('#drawerClose').click(); });

document.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if (f) { T[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.dataset.num !== undefined ? +e.target.value : e.target.value; saveTrip();
    if (['from', 'to', 'tour', 'hours', 'child', 'stop', 'time', 'date'].includes(f)) { if (f === 'from' || f === 'to') rerenderBooking(); else refreshSummary(); } }
  if (e.target.closest('#bbar')) updateQuick();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'bbar') { Object.assign(T, { kind: 'transfer', from: $('#qf').value, to: $('#qt').value, date: $('#qd').value || tomorrow(), time: $('#qh').value || '10:00', pax: +$('#qp').value, step: 1 }); saveTrip(); go('#book'); return; }
  if (f.id === 'bform') {
    if (T.step === 1 && T.kind === 'transfer' && T.from === T.to) { toast(L('Pickup and drop off are the same', 'Παραλαβή και προορισμός είναι ίδια')); return; }
    if (T.step === 3 && !checkDetails('#d-err')) return;
    if (T.step === 4) { addBooking('paid'); }
    T.step++; saveTrip(); lastTotal = 0;
    if (T.step === 5) { render(); return; }
    rerenderBooking(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if (f.id === 'reqform') { if (T.kind === 'transfer' && T.from === T.to) { toast(L('Pickup and drop off are the same', 'Παραλαβή και προορισμός είναι ίδια')); return; } if (!checkDetails('#d-err')) return; addBooking('request'); T.step = 5; saveTrip(); render(); return; }
  if (f.id === 'cform') { const n = $('#c-n').value.trim(), m = $('#c-e').value.trim(), msg = $('#c-m').value.trim(); const err = $('#c-err');
    if (n.length < 2 || !emailOk(m) || msg.length < 5) { err.hidden = false; err.textContent = L('Please fill in your name, a valid email and a message.', 'Συμπληρώστε όνομα, σωστό email και μήνυμα.'); return; }
    err.hidden = true; f.reset(); toast(L('Message sent (mockup). We reply within the hour.', 'Το μήνυμα στάλθηκε (mockup).')); return; }
  if (f.id === 'login') { if ($('#a-p').value === 'aspire2026') { admin.in = true; store.set('admin', true); render(); } else $('#a-err').hidden = false; return; }
  if (f.id === 'pform') { f.querySelectorAll('[data-fixed]').forEach(i => { const v = +i.value; if (v >= 20 && v <= 2000) D.fixed[i.dataset.fixed] = r5(v); }); f.querySelectorAll('[data-set]').forEach(i => { const v = +i.value; if (Number.isFinite(v) && v >= 0) D[i.dataset.set] = v; }); save(); render(false); toast(L('Prices saved. The site now shows the new fares.', 'Οι τιμές αποθηκεύτηκαν.')); return; }
  if (f.id === 'tform') { D.tours.forEach((t, i) => { const h = +f.querySelector(`[data-tour-h="${i}"]`).value, p = +f.querySelector(`[data-tour-p="${i}"]`).value; if (h >= 1 && h <= 18) t.h = h; if (p >= 50 && p <= 3000) t.price = r5(p); t.on = f.querySelector(`[data-tour-on="${i}"]`).checked; }); save(); render(false); toast(L('Tours saved', 'Οι εκδρομές αποθηκεύτηκαν')); return; }
  if (f.id === 'sform') { D.phones.forEach((p, i) => { p.name = f.querySelector(`[data-ph-n="${i}"]`).value.trim().slice(0, 30) || p.name; p.num = f.querySelector(`[data-ph-p="${i}"]`).value.trim().slice(0, 20) || p.num; }); const em = f.querySelector('[data-email]').value.trim(); if (emailOk(em)) D.email = em; f.querySelectorAll('[data-hero]').forEach(i => { if (i.value.trim()) D.hero[i.dataset.hero] = i.value.trim().slice(0, 40); }); save(); render(false); toast(L('Saved. Check the homepage.', 'Αποθηκεύτηκε.')); return; }
});

render(false);
})();
</script>
</body>
</html>
